# =============================================================================
# Grafana Configuration - OpenHostingNOC
# =============================================================================

[server]
domain = ${GRAFANA_DOMAIN}
root_url = https://${GRAFANA_DOMAIN}
serve_from_sub_path = false
http_port = 3000
protocol = http
enable_gzip = true
static_root_path = public

[database]
type = sqlite3
path = grafana.db
max_idle_conn = 10
max_open_conn = 100
conn_max_lifetime = 14400

[security]
admin_user = ${GRAFANA_ADMIN_USER:-admin}
admin_password = ${GRAFANA_ADMIN_PASSWORD:-changeme}
secret_key = ${GRAFANA_SECRET_KEY:-changeme}
login_remember_days = 30
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
data_source_proxy_whitelist = prometheus:9090,loki:3100,opensearch:9200,librenms:80,ntopng:3000

[auth]
login_cookie_name = grafana_session
disable_login_form = false
disable_signout_menu = false
signout_redirect_url = https://${DOMAIN}
oauth_auto_login = ${USE_LDAP:-false}

[auth.ldap]
enabled = ${GRAFANA_LDAP_ENABLED:-true}
config_file = /etc/grafana/ldap.toml
allow_sign_up = true

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[users]
default_theme = dark
home_page = /d/welcome
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false
editors_can_admin = false
user_invite_max_lifetime_days = 7

[rendering]
server_url = http://renderer:8081/render
callback_url = http://grafana:3000/

[unified_alerting]
enabled = true
execute_alerts = true
min_interval = 10s

[alerting]
enabled = false
execute_alerts = false

[analytics]
check_for_updates = false
reporting_enabled = false
feedback_links_enabled = false

[grafana_com]
url = https://grafana.com

[log]
mode = console
level = ${LOG_LEVEL:-info}

[log.console]
format = json

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[metrics]
enabled = true
interval_seconds = 15
basic_auth_username = ${GRAFANA_ADMIN_USER:-admin}
basic_auth_password = ${GRAFANA_ADMIN_PASSWORD:-changeme}

[external_image_storage]
provider = local

[smtp]
enabled = ${GRAFANA_SMTP_ENABLED:-false}
host = ${GRAFANA_SMTP_HOST:-smtp.example.com:587}
user = ${GRAFANA_SMTP_USER:-}
password = ${GRAFANA_SMTP_PASSWORD:-}
from_address = ${GRAFANA_SMTP_FROM:-grafana@example.com}
from_name = OpenHostingNOC Grafana
ehlo_identity = ${GRAFANA_DOMAIN}
skip_verify = false

[explore]
enabled = true

[panels]
enable_alpha = false
disable_sanitize_html = false

[plugins]
enable_alpha = false
app_tls_skip_verify_insecure = false

[feature_toggles]
enable = transformations
