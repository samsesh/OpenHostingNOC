# =============================================================================
# SNMP Exporter Configuration
# =============================================================================
# This is a minimal config. Generate the full config with:
#   docker run --rm prom/snmp-generator:v0.30.1 generate
#
# Or use the generate_snmp_config.sh script in the scripts/ directory.
# =============================================================================

auths:
  public_v2:
    community: public
    version: 2
  private_v2:
    community: private
    version: 2
  v3_auth:
    version: 3
    username: librenms
    security_level: authPriv
    auth_protocol: SHA
    auth_key: mysecurev3password
    priv_protocol: AES
    priv_key: mysecurev3password

modules:
  # Default IF-MIB (interfaces)
  if_mib:
    walk:
      - 1.3.6.1.2.1.2            # interfaces
      - 1.3.6.1.2.1.31.1.1       # ifXTable
      - 1.3.6.1.2.1.10           # transmission
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifAlias
      - source_indexes: [ifIndex]
        lookup: ifDescr
      - source_indexes: [ifIndex]
        lookup: ifName
    overrides:
      ifType:
        type: EnumAsStateSet
      ifOperStatus:
        type: EnumAsStateSet
      ifAdminStatus:
        type: EnumAsStateSet

  # UCD-SNMP-MIB (host resources)
  ucd:
    walk:
      - 1.3.6.1.4.1.2021          # UCD-SNMP-MIB
      - 1.3.6.1.2.1.25            # HOST-RESOURCES-MIB

  # MikroTik RouterOS
  mikrotik:
    walk:
      - 1.3.6.1.2.1.2             # interfaces
      - 1.3.6.1.2.1.4             # IP
      - 1.3.6.1.2.1.31.1.1        # ifXTable
      - 1.3.6.1.4.1.14988.1       # MIKROTIK-MIB
    max_repetitions: 10
    retries: 3
    timeout: 5s

  # Cisco
  cisco:
    walk:
      - 1.3.6.1.2.1.2             # interfaces
      - 1.3.6.1.2.1.4             # IP
      - 1.3.6.1.2.1.31.1.1        # ifXTable
      - 1.3.6.1.4.1.9.9.109       # CISCO-PROCESS-MIB
      - 1.3.6.1.4.1.9.9.48        # CISCO-ENVMON-MIB
      - 1.3.6.1.4.1.9.9.13        # CISCO-SNMP-TC
      - 1.3.6.1.2.1.15            # BGP4-MIB
      - 1.3.6.1.2.1.14            # OSPF-MIB
    max_repetitions: 10
    retries: 3
    timeout: 5s

  # Juniper
  juniper:
    walk:
      - 1.3.6.1.2.1.2             # interfaces
      - 1.3.6.1.2.1.4             # IP
      - 1.3.6.1.2.1.31.1.1        # ifXTable
      - 1.3.6.1.4.1.2636.3.1      # JUNIPER-MIB
      - 1.3.6.1.2.1.15            # BGP4-MIB
    max_repetitions: 10
    retries: 3
    timeout: 5s

  # Fortinet FortiGate
  fortinet:
    walk:
      - 1.3.6.1.2.1.2             # interfaces
      - 1.3.6.1.2.1.31.1.1        # ifXTable
      - 1.3.6.1.2.1.25            # HOST-RESOURCES-MIB
      - 1.3.6.1.4.1.12356.1.1     # FORTINET-MIB
    max_repetitions: 10
    retries: 3
    timeout: 5s

  # Arista
  arista:
    walk:
      - 1.3.6.1.2.1.2             # interfaces
      - 1.3.6.1.2.1.31.1.1        # ifXTable
      - 1.3.6.1.2.1.4             # IP
      - 1.3.6.1.4.1.30065.3.1     # ARISTA-SMI-MIB
    max_repetitions: 10
    retries: 3
    timeout: 5s

  # BGP Monitoring
  bgp:
    walk:
      - 1.3.6.1.2.1.15            # BGP4-MIB
    max_repetitions: 10
    retries: 3
    timeout: 10s

  # OSPF Monitoring
  ospf:
    walk:
      - 1.3.6.1.2.1.14            # OSPF-MIB
    max_repetitions: 10
    retries: 3
    timeout: 10s
