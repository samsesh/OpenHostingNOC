# =============================================================================
# Blackbox DNS Targets
# =============================================================================
# DNS servers to probe.
# ---------------------------------------------------------------------------

- targets:
    - '8.8.8.8'
  labels:
    target: google-dns
    type: external
    provider: google

- targets:
    - '1.1.1.1'
  labels:
    target: cloudflare-dns
    type: external
    provider: cloudflare

- targets:
    - '192.168.1.1'
  labels:
    target: internal-dns
    type: internal
