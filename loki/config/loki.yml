# =============================================================================
# Loki Configuration - OpenHostingNOC
# =============================================================================

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: ${LOG_LEVEL:-info}
  http_server_read_timeout: 60s
  http_server_write_timeout: 60s

common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/data/chunks
      rules_directory: /loki/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/data/index
    cache_location: /loki/data/cache
  filesystem:
    directory: /loki/data/chunks

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 30m
  chunk_block_size: 262144
  chunk_retain_period: 1m
  wal:
    enabled: true
    dir: /loki/data/wal

querier:
  max_concurrent: 16
  query_ingesters_within: 3h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 500
        ttl: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_entries_limit_per_query: 10000
  max_query_series: ${LOKI_MAX_QUERY_SERIES:-500}
  max_query_parallelism: ${LOKI_MAX_QUERY_PARALLELISM:-32}
  max_query_bytes_read: ${LOKI_MAX_QUERY_BYTES_READ:-100GB}
  max_streams_per_user: 10000
  max_global_streams_per_user: 50000
  max_chunks_per_query: 2000000
  cardinality_limit: 100000
  retention_period: ${LOKI_RETENTION_PERIOD:-744h}

compactor:
  working_directory: /loki/data/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

analytics:
  reporting_enabled: false

ruler:
  storage:
    type: local
    local:
      directory: /loki/data/rules
  rule_path: /loki/data/rules
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
