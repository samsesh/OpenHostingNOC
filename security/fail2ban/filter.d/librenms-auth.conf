# =============================================================================
# Fail2Ban filter for LibreNMS authentication failures
# =============================================================================
# Copy to /etc/fail2ban/filter.d/librenms-auth.conf
# =============================================================================

[Definition]
failregex = ^.*Failed login attempt.*from <HOST>.*$
            ^.*Invalid login.*<HOST>.*$
            ^.*Authentication failed.*<HOST>.*$

ignoreregex =
