# =============================================================================
# Fail2Ban filter for Traefik authentication failures
# =============================================================================
# Copy to /etc/fail2ban/filter.d/traefik-auth.conf
# =============================================================================

[Definition]
failregex = ^<HOST> - - \[.*\] "POST /auth HTTP/.*" 401 .*$
            ^<HOST> - - \[.*\] "GET /auth HTTP/.*" 401 .*$
            ^<HOST> - - \[.*\] ".*" 401 .* ".*" "-"$

ignoreregex =
