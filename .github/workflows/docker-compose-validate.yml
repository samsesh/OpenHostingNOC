name: Validate Docker Compose

on:
  push:
    branches: [main, Localhost]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.quickstart.yml'
      - '.env.example'
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.quickstart.yml'
      - '.env.example'
  workflow_dispatch:

env:
  DOMAIN: ci.nip.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config

      - name: Validate with quickstart override
        run: |
          docker compose -f docker-compose.yml -f docker-compose.quickstart.yml config

      - name: Validate .env.example syntax
        run: |
          errors=0
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            if ! echo "$line" | grep -q '^[A-Z_][A-Z0-9_]*='; then
              echo "Invalid line: $line"
              errors=$((errors + 1))
            fi
          done < .env.example
          [[ $errors -eq 0 ]] && echo "All env keys valid" || exit 1

      - name: Validate all YAML files
        run: |
          errors=0
          while IFS= read -r f; do
            python3 -c "import yaml; yaml.safe_load(open('$f')); print(f'OK: $f')" || {
              echo "INVALID: $f"
              errors=$((errors + 1))
            }
          done < <(find . -name '*.yml' -o -name '*.yaml' | grep -v node_modules | grep -v /.git/)
          [[ $errors -eq 0 ]] && echo "All YAML files valid" || exit 1
