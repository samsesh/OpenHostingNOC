name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! 🎉

            Please make sure you've checked our [CONTRIBUTING.md](https://github.com/samsesh/OpenHostingNOC/blob/Localhost/CONTRIBUTING.md) and the [Wiki](https://github.com/samsesh/OpenHostingNOC/wiki).

            A maintainer will review your issue shortly.
          pr-message: |
            Thanks for opening your first pull request! 🎉

            Please ensure you've read [CONTRIBUTING.md](https://github.com/samsesh/OpenHostingNOC/blob/Localhost/CONTRIBUTING.md) and that all CI checks pass.

            A maintainer will review your PR shortly.
